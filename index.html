<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>טכנולוגיות מידע: בין החלטות מבוססות נתונים לבין קושי להבחין באמת</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EFE4CC;--card:#FBF5E8;--ink:#0E1A33;--mut:#46506A;--coral:#E04348;--sun:#E3A008;--teal:#0A8A7E;--sky:#2A62D6;--line:#D3C3A0;--f:'Heebo','Arial Hebrew',Arial,sans-serif;--h:'Rubik','Heebo',Arial,sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#EFE4CC}}
*{box-sizing:border-box;margin:0}html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--f);line-height:1.6;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#app{height:100%;position:relative}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.45;pointer-events:none}
.top{position:absolute;inset:0 0 auto;display:flex;align-items:center;gap:14px;padding:18px 5vw;z-index:5}
.path{display:flex;gap:6px;flex:1}.path i{flex:1;height:6px;border-radius:9px;background:var(--line);cursor:pointer;transition:.3s}
.path i.on{background:var(--coral)}.path i.cur{background:var(--ink);flex:2.2}
.cnt{font:700 14px var(--h);letter-spacing:.06em;direction:ltr;color:var(--mut)}
.stage{position:absolute;inset:0;display:flex;align-items:center;padding:78px 6vw 84px}
.s{width:100%;max-width:1280px;margin:0 auto}
.eyebrow{display:inline-block;font:700 14px var(--h);letter-spacing:.14em;color:var(--coral);margin-bottom:10px;direction:ltr}
h1,h2{font-family:var(--h);font-weight:800;line-height:1.25;letter-spacing:0}
h1{font-size:clamp(34px,5.2vw,72px)}h2{font-size:clamp(28px,3.6vw,50px);margin-bottom:clamp(18px,3vh,36px)}
.sub{color:var(--mut);font-size:clamp(16px,1.6vw,22px);margin-top:14px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.row{display:flex;gap:clamp(12px,1.6vw,24px);align-items:stretch}
.card{flex:1;background:var(--card);border:2px solid var(--line);border-radius:26px;padding:clamp(18px,2.4vw,34px);position:relative;box-shadow:0 10px 0 -4px var(--cc,var(--line))}
.card .ic{width:clamp(44px,4.4vw,62px);aspect-ratio:1;border-radius:18px;background:var(--cc);color:#fff;display:grid;place-items:center;font:800 clamp(20px,2vw,28px) var(--h);margin-bottom:16px}
.card h3{font:700 clamp(19px,1.9vw,28px) var(--h);margin-bottom:8px}
.card p{color:var(--mut);font-size:clamp(15px,1.35vw,19px);line-height:1.7}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(12px,1.6vw,22px)}
.grid3 .card{display:flex;gap:16px;align-items:flex-start}.grid3 .ic{flex:none;margin:0}
.stat{font:800 clamp(52px,8vw,118px)/1 var(--h);color:var(--cc);margin-bottom:10px;direction:ltr;text-align:right}
.hero{text-align:right;max-width:1000px}.hero .sub{direction:ltr;text-align:right;font:700 15px var(--h);letter-spacing:.12em}
.names{margin-top:30px;font:700 20px var(--h);direction:ltr;text-align:right}
.pill{display:inline-block;background:var(--sun);padding:6px 16px;border-radius:99px;font:700 15px var(--h)}
.bars{display:flex;align-items:flex-end;gap:5%;height:clamp(200px,38vh,360px);padding:0 4%;border-bottom:3px solid var(--ink)}
.bw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.bar{width:100%;border-radius:14px 14px 0 0;background:var(--cc);min-height:6px;transform-origin:bottom}
.bv{font:800 clamp(20px,2.4vw,34px) var(--h);margin-bottom:6px;direction:ltr}
.bl{font:700 18px var(--h);text-align:center;margin-top:10px}
.split{display:flex;gap:clamp(20px,3vw,48px);align-items:center}.split>*{flex:1;min-width:0}
.img{border-radius:22px;border:2px solid var(--line);background:#fff;overflow:hidden;box-shadow:0 10px 0 -4px var(--sky)}.img img{display:block;width:100%;max-height:58vh;object-fit:contain}
.note{margin-top:clamp(16px,3vh,28px);background:var(--ink);color:#fff;border-radius:22px;padding:clamp(16px,2vw,26px) clamp(18px,2.6vw,34px);font:700 clamp(17px,1.8vw,26px)/1.6 var(--h)}
.q{background:var(--sun);color:var(--ink)}
.src{columns:2;column-gap:40px;direction:ltr;text-align:left;font-size:clamp(13px,1.2vw,17px);color:var(--mut)}.src li{margin-bottom:10px;break-inside:avoid;list-style:none;padding-inline-start:0}
.nav{position:absolute;bottom:max(18px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;gap:12px;z-index:5}
.nav button{width:52px;height:52px;border-radius:50%;border:2px solid var(--ink);background:#fff;font:800 22px var(--h);color:var(--ink);cursor:pointer;transition:.2s}.nav button:hover{background:var(--sun)}
.nav button:disabled{opacity:.3;cursor:default}
@media(max-width:820px){html,body{overflow:auto}.stage{position:relative;padding:76px 20px 96px;display:block}.row,.split{flex-direction:column}.grid3{grid-template-columns:1fr}.bars{height:240px}.src{columns:1}}
</style></head><body><div id="app"></div>

>הקושי אינו רק לבדוק אם ההתרעה נכונה, אלא גם אם המקור שמציג אותה הוא מי שאנחנו חושבים שהוא.</div>`},
{p:'מקרה בוחן',e:'CASE STUDY · INDIA 2018',t:'שמועות על חוטפי ילדים בהודו — ממידע כוזב לנזק ממשי',r:()=>html`<div class="row"><div class="card" data-a style=${{'--cc':CL[0]}}><span class="pill">ריינפאדה, מחוז דהולה | 1 ביולי 2018</span><p style=${{marginTop:14}}>חמישה גברים נהרגו לאחר שהמון חשד בהם בטעות בחטיפת ילדים. לפי הדיווח על חקירת המשטרה, השמועה התפשטה ב־${E('WhatsApp')} וגם מפה לאוזן. בגל השמועות הרחב בהודו הופצו גם סרטונים אמיתיים שהוצאו מהקשרם והוצגו כ״הוכחה״ לפעילות של חוטפי ילדים.</p></div><div class="card" data-a style=${{'--cc':CL[2]}}><h3>היקף התופעה</h3><p>תחקיר ${E('BBC')} זיהה לפחות 31 הרוגים ב־23 אירועי אלימות בהודו במשך כשנתיים, על רקע שמועות כוזבות שהופצו ברשתות ובאפליקציות מסרים. זהו נתון מצטבר, ולא מספר ההרוגים באירוע בדהולה.</p></div></div><div class="note" data-a>באיזה שלב ניתן היה להתערב כדי לצמצם את הסיכון לנזק?</div>`},
{p:'פעילות',e:'ACTIVITY · 1/2',t:'מחליטים לפני שהמידע אומת',r:()=>html`<div class="row"><div class="card" data-a style=${{'--cc':CL[3]}}><h3>התרחיש</h3><p>באפליקציית מסרים מוצפנת מתפשטת הודעת אזהרה על חוטפי ילדים. מתקבלים דיווחים שהיא כוזבת ועלולה לעורר אלימות, אך אין עדיין אימות מספק. משתמשים אחרים טוענים שזו התרעה חיונית.</p><p style=${{marginTop:10}}>אתם ארבעה צוותים המייעצים להנהלת האפליקציה, כל אחד מנקודת מבט אחרת.</p></div><div class="card q" data-a style=${{'--cc':'var(--ink)'}}><h3>ההחלטה המשותפת</h3><p style=${{color:'var(--ink)',fontWeight:700}}>האם להטיל כבר עכשיו מגבלה זמנית על העברת הודעות לכל המשתמשים, לפני שהמידע אומת, גם במחיר האטת התראה שעשויה להיות אמיתית?</p></div></div><div class="note" data-a>בשתי החלופות קיימים סימון הודעות מועברות, דיווח משתמשים ובדיקת דיווחים.</div>`},
{p:'ארבע קבוצות',e:'ACTIVITY · 2/2',t:'ארבע קבוצות, ארבע נקודות מבט',r:()=>html`<div class="grid3" style=${{gridTemplateColumns:'1fr 1fr'}}>${[['צוות בטיחות והגנת משתמשים','המוקד: מניעת פגיעה באנשים. המליצו כיצד לפעול לפני האימות. שקלו את הסיכון שבהמתנה לצד המחיר של הגבלה מיותרת.'],['צוות נציגי משתמשים וסיוע בחירום','המוקד: העברה מהירה של מידע חיוני. בחנו כיצד המגבלה תשפיע על התרעות ובקשות לעזרה, וכיצד ניתן לצמצם את הסיכון באופן משמעותי.'],['צוות בדיקת עובדות','המוקד: איכות הראיות ואי-הוודאות. הבחינו בין מה שידוע למה שחסר. המליצו אם הראיות מספיקות לפעולה וציינו מה ישנה את עמדתכם.'],['צוות פיתוח ומערכות מידע','המוקד: יישום, פרטיות ומדידה. המליצו על פתרון שאפשר ליישם. הגדירו מדד הצלחה ותנאי לשינוי או להפסקת ההתערבות.']].map((c,i)=>html`<div class="card" data-a style=${{'--cc':CL[i]}}><div class="ic">${i+1}</div><div><h3>${c[0]}</h3><p>${c[1]}</p></div></div>`)}</div><div class="note" data-a>התפקיד מגדיר את סדר העדיפויות. כל קבוצה בוחרת בעצמה אם לתמוך במגבלה או להתנגד לה.</div>`},
{p:'אחריות',e:'RESPONSIBILITY',t:'מי אחראי ומה אפשר לעשות?',r:()=>html`<div class="row">${cards([['המשתמשים','בדיקת מקור לפני העברה וחשיבה ביקורתית.','◐'],['מפתחי מערכות','מדדים מעבר למעורבות, ביקורת חיצונית ובדיקת סיכונים.','</>'],['פלטפורמות דיגיטליות','הגבלת העברה, סימון תוכן ושקיפות לגבי האלגוריתמים.','▣'],['המחוקק','חובות שקיפות ואחריות, ושאלת זיהוי המקור מול פרטיות.','§']])}</div>`},
{p:'נקודת מבט',e:'IS GRADUATE PERSPECTIVE',t:'נקודות מבט של בוגר מערכות מידע',r:()=>html`<div class="row">${cards([['להגביר מודעות','לעזור לסביבה שלנו לפתח חשיבה ביקורתית ולהבין שלא כל מידע במערכת הוא אמין.','◎'],['מדדי הצלחה','למדוד גם אמינות, דיוק והוגנות ולא רק מעורבות. תשומת לב אינה שווה אמת.','✓'],['סיכונים והטיות','לבדוק איכות נתונים ולזהות הטיות לפני השקת המערכת.','!'],['תכנון','להציג מידע באופן מאוזן, ללא העדפה לא מוצדקת וללא הטעיית המשתמש.','✎']])}</div><div class="note" data-a>האתגר אינו רק לזהות מידע שקרי, אלא לתכנן ולנהל מערכות מידע שמצמצמות את הפצת השקר, תוך שמירה על חופש הביטוי, הפרטיות והאמון הציבורי.</div>`},
{p:'מקורות',e:'REFERENCES',t:'מקורות',r:()=>html`<ul class="src">${['Lazer, D. M. J., et al. (2018). The science of fake news. Science, 359(6380).','Vosoughi, S., Roy, D., & Aral, S. (2018). The spread of true and false news online. Science, 359(6380).','Zhou, M., et al. (2024). Bias in generative AI. arXiv:2403.02726.','Lazer, D., Kennedy, R., King, G., & Vespignani, A. (2014). The parable of Google Flu. Science.','CNN (2024, February 4). Finance worker pays out $25 million after video call with deepfake chief financial officer.','Reuters Institute (2025, 2026). Digital News Report.','Israel Democracy Institute (2024). Media and Social Media Consumption, Trust, and Literacy.','BBC (2018). Social media rumors in India: counting the dead.','Meta (2025). More Speech and Fewer Mistakes.','ICO. Data protection by design and by default.','ynet (2023, October 17). אפליקציית ״צבע אדום״ מזויפת מנסה לפרוץ לטלפונים של ישראלים.'].map(s=>html`<li data-a>${s}</li>`)}</ul>`},
{p:'תודה',r:()=>html`<div class="hero" style=${{textAlign:'center',margin:'0 auto'}}><h1 data-a>תודה על ההקשבה</h1><div class="sub" data-a style=${{textAlign:'center',fontSize:28}}>Thank You</div><div class="names" data-a style=${{textAlign:'center'}}>Hanan Hijaze · Ahed Zoabi</div></div>`}
];
function App(){
 const [i,setI]=useState(()=>Math.max(0,Math.min(S.length-1,(parseInt(location.hash.slice(1))||1)-1)));
 const ref=useRef(),dir=useRef(1);
 const go=useCallback(n=>{n=Math.max(0,Math.min(S.length-1,n));setI(p=>{dir.current=n>=p?1:-1;return n})},[]);
 useEffect(()=>{const k=e=>{if(['ArrowLeft','PageDown',' '].includes(e.key)){e.preventDefault();go(i+1)}if(['ArrowRight','PageUp'].includes(e.key)){e.preventDefault();go(i-1)}};addEventListener('keydown',k);return()=>removeEventListener('keydown',k)},[i,go]);
 useEffect(()=>{history.replaceState(null,'','#'+(i+1))},[i]);
 useEffect(()=>{
  const r=ref.current,x=dir.current*-60;
  const ctx=gsap.context(()=>{
   const tl=gsap.timeline();
   tl.from('[data-e],[data-t]',{y:24,opacity:0,duration:.5,stagger:.1,ease:'power3.out'});
   tl.from('[data-a]',{x,y:30,opacity:0,scale:.96,duration:.7,stagger:.14,ease:'back.out(1.4)'},.15);
   tl.from('.bar',{scaleY:0,duration:1.1,stagger:.2,ease:'power3.out'},.3);
   r.querySelectorAll('[data-n]').forEach(el=>{const to=+el.dataset.n,o={v:0},c=el.dataset.c;gsap.to(o,{v:to,duration:1.4,delay:.4,ease:'power2.out',onUpdate:()=>{el.textContent=c?Math.round(o.v).toLocaleString():(Number.isInteger(to)?Math.round(o.v):o.v.toFixed(1))+(c?'':'%')}})});
   gsap.fromTo('.blob',{scale:.8},{scale:1.1,duration:4,yoyo:true,repeat:-1,ease:'sine.inOut',stagger:.5});
  },r);return()=>ctx.revert();
 },[i]);
 const s=S[i];
 return html`<div id="app" ref=${ref}>
  <div class="blob" style=${{width:380,height:380,background:'var(--sun)',top:'-8%',left:'-6%'}}></div>
  <div class="blob" style=${{width:320,height:320,background:'var(--teal)',bottom:'-10%',right:'-4%'}}></div>
  <div class="blob" style=${{width:260,height:260,background:'var(--coral)',top:'40%',left:'45%',opacity:.18}}></div>
  <div class="top"><div class="path">${S.map((x,j)=>html`<i key=${j} class=${j<i?'on':j===i?'cur':''} title=${x.p} onClick=${()=>go(j)}></i>`)}</div><div class="cnt">${String(i+1).padStart(2,'0')} / ${S.length}</div></div>
  <div class="stage"><div class="s" key=${i}>${s.e&&html`<div class="eyebrow" data-e>${s.e}</div>`}${s.t&&html`<h2 data-t>${s.t}</h2>`}${s.r()}</div></div>
  <div class="nav"><button onClick=${()=>go(i-1)} disabled=${i===0} aria-label="הקודם">→</button><button onClick=${()=>go(i+1)} disabled=${i===S.length-1} aria-label="הבא">←</button></div>
 </div>`}
ReactDOM.createRoot(document.getElementById('app')).render(html`<${App}/>`);
</script></body></html>
